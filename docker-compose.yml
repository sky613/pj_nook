services:
  web:
    build:
      context: .
      target: dev
    container_name: nook-web
    ports:
      - "3200:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  # 프로덕션 빌드 확인용: docker compose --profile prod up --build prod
  prod:
    build:
      context: .
      target: runner
    container_name: nook-prod
    ports:
      - "3201:3000"
    profiles: ["prod"]

volumes:
  node_modules:
  next_cache:
